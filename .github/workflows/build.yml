name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          link-to-sdk: true

      - name: Build Module Package
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: soft_restart_fix
          path: soft_restart_fix.zip

      - name: Generate Release Changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --tags --force 2>/dev/null || true

          echo "# 更新日志 (${GITHUB_REF_NAME})" > changelog.md
          echo "" >> changelog.md

          # 1. 提取当前 Tag 的说明信息
          TAG_MSG="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          if [ -n "$(echo "$TAG_MSG" | tr -d '[:space:]')" ]; then
            echo "$TAG_MSG" >> changelog.md
            echo "" >> changelog.md
          fi

          # 2. 提取自上个版本 Tag 至今的全部提交记录
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            COMMITS="$(git log "${PREV_TAG}..${GITHUB_REF_NAME}" --no-merges --pretty=format:"- %s (%h)" 2>/dev/null || true)"
          else
            COMMITS="$(git log -10 --no-merges --pretty=format:"- %s (%h)" 2>/dev/null || true)"
          fi

          if [ -n "$COMMITS" ]; then
            echo "### 提交明细" >> changelog.md
            echo "$COMMITS" >> changelog.md
            echo "" >> changelog.md
          fi

          echo "=== 自动生成的完整 changelog.md ==="
          cat changelog.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            soft_restart_fix.zip
            changelog.md
          body_path: changelog.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
